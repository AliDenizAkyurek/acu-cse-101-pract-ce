name: "ACU CSE 101 - TA Automated Grading"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  grade:
    if: >-
      github.repository == 'Krr0ptioN/acu-cse-101-pract-ce' &&
      github.event.pull_request.base.ref == github.event.pull_request.head.repo.owner.login &&
      startsWith(github.event.pull_request.head.ref, 'submit/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted course action and tests
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Checkout student exercise snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: student-submission
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare student exercises with course tests
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/prepare_grading.py
      - name: Run bundled TA review action
        uses: ./.github/actions/ta-review
        with:
          github-token: ${{ github.token }}
          week: auto
          record-submission-branch: "false"
